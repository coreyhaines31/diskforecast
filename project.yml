name: Roomy
options:
  bundleIdPrefix: app.roomy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  RoomyCore:
    path: Packages/RoomyCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  Roomy:
    type: application
    platform: macOS
    sources:
      - Roomy
    dependencies:
      - package: RoomyCore
      - package: Sparkle
    info:
      path: Roomy/Info.plist
      properties:
        CFBundleDisplayName: Roomy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        NSDesktopFolderUsageDescription: Measuring your Desktop shows what's taking up space there.
        NSDocumentsFolderUsageDescription: Measuring your Documents shows what's taking up space there.
        NSDownloadsFolderUsageDescription: Measuring your Downloads finds large and old files you might not need.
        NSRemovableVolumesUsageDescription: Measuring removable drives shows what's taking up space on them.
        NSNetworkVolumesUsageDescription: Measuring network drives shows what's taking up space on them.
        NSAppleEventsUsageDescription: Some fixes, like removing local Time Machine snapshots, ask for your administrator password.
        # TODO(release): replace with the appcast URL and the Sparkle public key for this app.
        SUFeedURL: https://example.invalid/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Roomy
        PRODUCT_MODULE_NAME: Roomy
        PRODUCT_BUNDLE_IDENTIFIER: app.roomy.Roomy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Roomy:
    build:
      targets:
        Roomy: all
    test:
      targets:
        - package: RoomyCore/RoomyCoreTests
