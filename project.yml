name: DiskForecast
options:
  bundleIdPrefix: app.diskforecast
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: KPQU8X839X
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
packages:
  DiskForecastCore:
    path: Packages/DiskForecastCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  DiskForecast:
    type: application
    platform: macOS
    sources:
      - DiskForecast
    dependencies:
      - package: DiskForecastCore
      - package: Sparkle
    info:
      path: DiskForecast/Info.plist
      properties:
        CFBundleDisplayName: Disk Forecast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Corey Haines. FSL-1.1-MIT.
        NSDesktopFolderUsageDescription: Measuring your Desktop shows what's taking up space there.
        NSDocumentsFolderUsageDescription: Measuring your Documents shows what's taking up space there.
        NSDownloadsFolderUsageDescription: Measuring your Downloads finds large and old files you might not need.
        NSRemovableVolumesUsageDescription: Measuring removable drives shows what's taking up space on them.
        NSNetworkVolumesUsageDescription: Measuring network drives shows what's taking up space on them.
        NSAppleEventsUsageDescription: Some fixes, like removing local Time Machine snapshots, ask for your administrator password.
        SUFeedURL: https://github.com/coreyhaines31/diskforecast/releases/latest/download/appcast.xml
        # TODO(release): replace with this app's Sparkle public key (generate_keys --account diskforecast).
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Disk Forecast
        PRODUCT_MODULE_NAME: DiskForecast
        PRODUCT_BUNDLE_IDENTIFIER: app.diskforecast.DiskForecast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  DiskForecast:
    build:
      targets:
        DiskForecast: all
    test:
      targets:
        - package: DiskForecastCore/DiskForecastCoreTests
