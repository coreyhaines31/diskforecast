<!doctype html>
<!-- Source for images/og.png (1200×630). Regenerate:
     agent-browser set viewport 1200 630 && agent-browser open file://$PWD/site/_build/og.html && agent-browser screenshot site/images/og.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disk Forecast social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f5f6f8; color: #1d1d1f; letter-spacing: -0.012em;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .sky i { position: absolute; border-radius: 50%; opacity: 0.85; }
  .sky i:nth-child(1) { width: 760px; height: 760px; left: -220px; top: -260px; background: radial-gradient(circle, #9ccdff, transparent 68%); }
  .sky i:nth-child(2) { width: 640px; height: 640px; right: -160px; top: -240px; background: radial-gradient(circle, #ffd98a, transparent 68%); }
  .sky i:nth-child(3) { width: 600px; height: 600px; left: 380px; top: 250px; background: radial-gradient(circle, #bfeedd, transparent 68%); }
  .sky i:nth-child(4) { width: 520px; height: 520px; right: -60px; top: 230px; background: radial-gradient(circle, #cdd2ff, transparent 68%); }
  .glass { position: relative; background: rgba(255,255,255,0.58); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(0,0,0,0.04), 0 1px 2px rgba(15,30,55,0.05), 0 14px 40px rgba(15,30,55,0.10); }
  .card { position: absolute; inset: 44px 52px; border-radius: 44px; padding: 0 64px; display: flex; flex-direction: column; justify-content: center; }
  .menubar { position: absolute; top: 22px; right: 28px; display: flex; align-items: center; gap: 18px; font-size: 21px; color: #1d1d1f; white-space: nowrap; }
  .pill { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,0.78); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(15,30,55,0.08), 0 8px 22px rgba(15,30,55,0.12); }
  .pill svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .pill .sep { color: #6e6e73; font-weight: 400; }
  .pill .full { color: #0a6cdf; }
  .clock { color: #3a3a3f; font-weight: 500; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 38px; font-weight: 600; letter-spacing: -0.025em; }
  .brand img { width: 92px; height: 92px; filter: drop-shadow(0 10px 20px rgba(15,30,55,0.22)); }
  h1 { margin: 34px 0 0; font-size: 84px; line-height: 1.0; font-weight: 700; letter-spacing: -0.045em; max-width: 960px; }
  h1 em { font-style: normal; color: #0a6cdf; }
  .sub { margin-top: 26px; font-size: 26px; color: #55555b; letter-spacing: -0.015em; }
</style>
</head>
<body>
  <div class="sky"><i></i><i></i><i></i><i></i></div>
  <div class="card glass">
    <div class="menubar">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="M5.5 9.5 7.3 5.6A2 2 0 0 1 9.1 4.5h5.8a2 2 0 0 1 1.8 1.1l1.8 3.9"/><rect x="3.5" y="9.5" width="17" height="9" rx="2.2"/><path d="M8.5 14h.01M11 14h.01M13.5 14h.01M16 14h.01"/></svg>142 GB <span class="sep">·</span> <span class="full">Full in ~41 days</span></span>
      <span class="clock">Mon 9:41 AM</span>
    </div>
    <div class="brand"><img src="../images/icon.svg" alt="">Disk Forecast</div>
    <h1>Know before your Mac runs <em>out of space.</em></h1>
    <div class="sub">Free for macOS · diskforecast.com</div>
  </div>
</body>
</html>
