name: Idea
description: Suggest something Disk Forecast should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or question you had, in your own words. "I wanted to know why my disk filled up overnight" is more useful than a feature name.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like Disk Forecast to handle it, if you have an idea.
